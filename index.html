/* 10.7 Record payment (Screen 11) — incoming client payment */
function mPayment(m){
  const i = iv(m.id); if(!i) return '';
  const f = m.f, bal = balance(i), amt = +f.amount, c = cl(i.client), t = f.tried;
  const amtErr = (t && !(amt>0)) ? 'Enter the amount received.' : amt>bal+0.004 ? `Exceeds the open balance by ${money(amt-bal)}. Overpayments are not supported yet.` : '';
  const dateErr = t && !f.date ? 'Enter the date received.' : f.date>TODAY ? 'The received date cannot be in the future.' : '';
  const after = r2(bal-(amt>0?amt:0)), partial = amt>0 && !amtErr && after>0.004, full = amt>0 && !amtErr && after<=0.004;
  const reasonErr = t && partial && !f.reason ? 'Select a reason for the partial payment.' : t && partial && f.reason==='Other' && !(f.reasonText||'').trim() ? 'Describe the reason.' : '';
  return `${head('Record client payment', `${esc(invNo(i))} · ${esc(c.name)}`, `<div class="row" style="margin-right:6px">${badge('Incoming','info')}</div>`)}
  <div class="modal-body">
    ${formLegend()}
    <div class="box soft"><div class="sumline"><span class="muted">Invoice total</span><span class="tnum">${money(invTotal(i))}</span></div><div class="sumline"><span class="muted">Already received (${i.payments.length})</span><span class="tnum">${money(paidAmt(i))}</span></div><div class="sumline total"><span>Open balance</span><span class="tnum">${money(bal)}</span></div><div class="xs muted" style="margin-top:6px">Due ${fmtD(i.due)}${overdueDays(i)?` · <b style="color:var(--danger)">${overdueDays(i)} days overdue</b>`:''}</div></div>
    <div class="form-grid">
      ${field('Amount received ($)', `<div class="input-pre ${amtErr?'invalid':''}"><span>$</span><input id="pm-amt" type="number" step="0.01" min="0" data-model="ui.modal.f.amount" data-live="change" value="${esc(f.amount)}" aria-invalid="${!!amtErr}" ${amtErr?'aria-describedby="pm-amt-err"':''}></div>`, { for:'pm-amt', req:true, err:amtErr })}
      ${field('Date received', inp('pm-date','ui.modal.f.date',f.date,{type:'date',max:TODAY,err:dateErr,live:'change'}), { for:'pm-date', req:true, err:dateErr, help:'When the funds arrived — not today’s recording date' })}
      ${field('Payment method', sel('pm-meth','ui.modal.f.method',f.method,['ACH transfer','Wire transfer','Check','Other']), { for:'pm-meth', req:true })}
      ${field('Transaction / reference #', inp('pm-ref','ui.modal.f.ref',f.ref,{ph:'e.g. ACH-9923841 or Check #4891'}), { for:'pm-ref' })}
    </div>
    <div class="alert ${full?'alert-success':partial?'alert-warning':'alert-neutral'}" aria-live="polite"><span class="a-ic">${ic(full?'checkCircle':partial?'alert':'info',18,2)}</span><div class="a-body">
      ${full?`<b>Result: Paid</b><span>Balance becomes $0.00 and scheduled payment reminders stop.</span>`: partial?`<b>Result: Partially Paid</b><span>Remaining balance <b>${money(after)}</b>. A reason is required and the admin will be notified (simulated).</span>`:'<span>Enter an amount to see how the payment status will change.</span>'}</div></div>
    ${partial?`<div class="form-grid">${field('Reason for partial payment', sel('pm-rsn','ui.modal.f.reason',f.reason,[['','Select a reason…'],'Client disputed hours','Deduction or short payment','Installment agreed','Remittance in transit','Other'],{err:reasonErr&&!f.reason}), { for:'pm-rsn', req:true, err: !f.reason?reasonErr:'' })}
      ${field(f.reason==='Other'?'Describe the reason':'Details', inp('pm-rt','ui.modal.f.reasonText',f.reasonText,{ph:'e.g. 56 hours under client manager review',err:f.reason==='Other'&&reasonErr}), { for:'pm-rt', req:f.reason==='Other', err: f.reason==='Other'?reasonErr:'' })}</div>`:''}
    ${field('Payment notes', ta('pm-note','ui.modal.f.note',f.note,{ph:'Optional notes about remittance or deductions',rows:2}), { for:'pm-note' })}
    <span class="xs muted row" style="gap:6px">${ic('info',13)}This records money received from the client only (“Client Payment Received”). It never completes the vendor payout — that is recorded separately in Vendor payments. ${assume(6,'Partial payment rules')}</span>
  </div>
  <div class="modal-foot"><span class="grow"></span>${btn('Cancel',{act:'closeModal'})}${btn('Save payment',{act:'savePayment',cls:'btn-primary',icon:'check'})}</div>`;
}

/* 10.8 Record vendor payout — outgoing */
function mPayout(m){
  const i = iv(m.id), po = payoutInfo(i), f = m.f, t = f.tried, P = pl(i.placement), L = lateInfo(i);
  const hd = head('Record vendor payout', `${esc(po.vendor.name)} · ${esc(consOf(P).name)} · ${esc(pe(i.period).label)}`, `<div class="row" style="margin-right:6px">${badge('Outgoing','neutral')}</div>`);
  if(po.payMissing) return `${hd}<div class="modal-body">${alertBox('danger','alert',`<b>Pay rate missing</b><span>${esc(PAY_ERR)}</span><div>${btn('Open placement',{act:'openPlacement',a:P.id,cls:'btn-sm btn-primary',icon:'edit'})}</div>`)}</div>
  <div class="modal-foot"><span class="grow"></span>${btn('Close',{act:'closeModal'})}</div>`;
  const amt = +f.amount, cap = r2(po.expected - po.paid), late = !!(L && L.delayedDays>0);
  const aErr = t && !(amt>0) ? 'Enter the amount paid.' : amt>cap+0.004 ? `Exceeds the amount still payable (${money(cap)}).` : '';
  const dErr = t && !f.date ? 'Enter the payment date.' : f.date>TODAY ? 'Date cannot be in the future.' : '';
  const lErr = t && late && !(f.lateReason||'').trim() ? 'Add a reason for the late timesheet.' : '';
  const after = r2(cap-(amt>0?amt:0)), full = amt>0 && !aErr && after<=0.004, part = amt>0 && !aErr && after>0.004;
  return `${hd}
  <div class="modal-body">
    ${formLegend()}
    ${!po.contactable?alertBox('warning','alert',`<span>This employer is marked <b>Do not contact</b>. The payout can still be recorded, but no confirmation email will be sent.</span>`):''}
    <div class="box soft">${kv([['Related client invoice',`${esc(invNo(i))} · ${WF[i.status][0]}${i.status==='sent'?' · '+payStatus(i):''}`],['Amount payable',`${money(po.expected)} <span class="muted small">(${hrs(i.hours)} × ${money(P.pay)})</span>`],['Paid so far',money(po.paid)],['Remaining',`<b>${money(cap)}</b>`],['Timesheet received',fmtD(i.dates.ts)],['Due',`${fmtD(po.due)} (Net ${po.vendor.terms})${po.late?` · <b style="color:var(--danger)">${po.late} d late</b>`:''}`]])}</div>
    ${late?`<div class="box" style="border-color:var(--warning-line);background:#FFF9F2"><div class="row wrap"><h3 class="section-t grow">${ic('clock',16)}Late timesheet</h3>${badge(plural(L.delayedDays,'day')+' late','warning')}${assume(19,'Provisional rule')}</div>
      ${kv([['Expected by',fmtD(L.expected)],['Received',fmtD(L.actual)],['Original payout date',L.originalPayoutDate?fmtD(L.originalPayoutDate):'—'],['Revised payout date',L.revisedPayoutDate?`<b>${fmtD(L.revisedPayoutDate)}</b>`:'—']])}
      ${field('Reason for the delay', ta('po-late','ui.modal.f.lateReason',f.lateReason,{rows:2,err:lErr,ph:'e.g. Vendor sent the signed timesheet after the cut-off'}), { for:'po-late', req:true, err:lErr })}</div>`:''}
    <div class="form-grid">
      ${field('Amount paid ($)', inp('po-amt','ui.modal.f.amount',f.amount,{type:'number',step:'0.01',min:0,err:aErr,live:'change',req:true}), { for:'po-amt', req:true, err:aErr, help:'Part payments are allowed; the rest stays open.' })}
      ${field('Date paid', inp('po-date','ui.modal.f.date',f.date,{type:'date',max:TODAY,err:dErr,live:'change'}), { for:'po-date', req:true, err:dErr })}
      ${field('Method', sel('po-m','ui.modal.f.method',f.method,['ACH transfer','Wire transfer','Check','Other']), { for:'po-m', req:true })}
      ${field('Reference #', inp('po-ref','ui.modal.f.ref',f.ref,{ph:'e.g. OUT-ACH-30991'}), { for:'po-ref' })}
    </div>
    <div class="alert ${full?'alert-success':part?'alert-warning':'alert-neutral'}" aria-live="polite"><span class="a-ic">${ic(full?'checkCircle':part?'alert':'info',18,2)}</span><div class="a-body">${full?'<b>Result: Vendor payout completed</b><span>The remaining amount becomes $0.00.</span>':part?`<b>Result: Partially Paid</b><span>${money(after)} stays open for this vendor.</span>`:'<span>Enter an amount to see the vendor payment status.</span>'}</div></div>
    <label class="check"><input type="checkbox" data-model="ui.modal.f.confirm" ${f.confirm&&po.contactable?'checked':''} ${po.contactable?'':'disabled'}>Email payment confirmation to ${esc(po.vendor.invoiceEmail||'the vendor')} (simulated)</label>
    <span class="xs muted row" style="gap:6px">${ic('info',13)}Vendor payouts are tracked separately. A client payment never completes a vendor payout. ${assume(10,'Vendor payout rules')}</span>
  </div>
  <div class="modal-foot"><span class="grow"></span>${btn('Cancel',{act:'closeModal'})}${btn('Save payout',{act:'savePayout',cls:'btn-primary',icon:'check'})}</div>`;
}

/* 10.9 Override template (Screen 12) — retained only as an exception */
function mOverride(m){

function addFiles(plId, list){
  const b = S.ui.batch, arr = b.files[plId] = b.files[plId] || [];
  let rejected = [];
  [...list].forEach(f => { const ext = (f.name.split('.').pop()||'').toLowerCase(); if(!['png','jpg','jpeg','pdf'].includes(ext)){ rejected.push(f.name+' (unsupported format)'); return; } if(f.size>10*1024*1024){ rejected.push(f.name+' (over 10 MB)'); return; } if(arr.some(x=>x.name===f.name)){ rejected.push(f.name+' (already added)'); return; }
    arr.push({ id:uid('f'), name:f.name, size:f.size||1, ext, state:'queued', progress:0, daysPlanned:5 }); });
  if(b.ocr==='done') b.ocr = 'idle';
  delete b.rows[plId]; delete b.confirmed[plId];
  b.notice = b.notice || {}; b.notice[plId] = rejected.length ? (rejected.length===1 ? 'Not added: '+rejected[0] : `${rejected.length} files were not added: `+rejected.join(', ')) : '';
  render();
}
ACT.sampleFiles = plId => {
  const p = pl(plId), per = pe(S.ui.batch.period), c = consOf(p), idx = selPls().findIndex(x=>x.id===plId);
  const n = Math.max(1, Math.min(5, Math.ceil(daysIn(per.start,per.end).length/7))), ext = /scan|paper/i.test(p.tsFormat) ? 'pdf' : 'png';
  const base = c.name.replace(/\s+/g,'_');
  const files = Array.from({ length:n }, (_,k)=>({ name:`${base}_week${k+1}${idx===0&&n>=2&&k===Math.min(2,n-1)?'_lowres':''}.${ext}`, size:(180+((k*137+idx*61)%700))*1024 }));
  addFiles(plId, files);
  const arr = S.ui.batch.files[plId]; arr.forEach(f=>{ if(/_lowres/.test(f.name) && f.state==='queued' && f.failOnce==null) f.failOnce = true; });
  render();
};
ACT.removeFile = (plId, fid) => { const b = S.ui.batch; b.files[plId] = (b.files[plId]||[]).filter(f=>f.id!==fid); delete b.rows[plId]; delete b.confirmed[plId]; if(b.ocr==='done') b.ocr='idle'; (b.files[plId]||[]).forEach(f=>{ if(f.state==='processed') f.state='processed'; }); recheckOCR(); render(); };
ACT.retryFile = (plId, fid) => { const f = (S.ui.batch.files[plId]||[]).find(x=>x.id===fid); f.state = 'queued'; f.progress = 0; f.error = ''; S.ui.batch.ocr = 'idle'; render(); };
function recheckOCR(){ const b = S.ui.batch, pls = selPls(); const all = pls.flatMap(p=>b.files[p.id]||[]); if(all.length && all.every(f=>f.state==='processed') && pls.every(p=>(b.files[p.id]||[]).length)){ pls.forEach((p,idx)=>{ if(!b.rows[p.id]) b.rows[p.id] = genRows(p, pe(b.period), idx, b.files[p.id]); }); b.ocr = 'done'; } }
function genRows(p, per, idx, files){
  const names = (files||[]).map(f=>f.name), days = daysIn(per.start,per.end).filter(d=>d>=p.start && d<=p.end), work = days.filter(d=>!isWeekend(d));
  const src = k => names[Math.min(names.length-1, Math.floor(k/5))] || names[0];
  const rows = work.map((d,k)=>({ id:uid('r'), date:d, hours:8, orig:8, src:src(k), flag:'', include:true }));
  if(rows.length>6){ const m = rows[3+idx%3]; m.hours = null; m.orig = null; m.flag = 'missing'; m.src = '—'; }
  if(rows.length>9){ const h = rows[8+idx%2]; h.hours = h.orig = 11.5; h.flag = 'high'; }
  if(rows.length>13 && names.length>1){ const d = rows[12]; rows.push(Object.assign({}, d, { id:uid('r'), src:names[Math.min(names.length-1, 3)], flag:'duplicate', include:false })); }
  const wk = days.find(d=>isWeekend(d)); if(idx===0 && wk) rows.push({ id:uid('r'), date:wk, hours:4, orig:4, src:src(0), flag:'weekend', include:true });
  rows.push({ id:uid('r'), date:addDays(per.start,-1), hours:8, orig:8, src:names[0], flag:'outside', include:false });
  return rows.sort((a,b)=>a.date.localeCompare(b.date) || (a.flag==='duplicate'?1:-1));
}
let ocrTimer = null;
ACT.runOCR = () => {
  const b = S.ui.batch, pls = selPls(); b.ocr = 'running';
  pls.forEach(p=>(b.files[p.id]||[]).forEach(f=>{ if(f.state==='queued'){ f.state = 'uploading'; f.progress = 0; } }));
  render(); clearInterval(ocrTimer);
  ocrTimer = setInterval(()=>{
    let active = false;
    pls.forEach(p=>(b.files[p.id]||[]).forEach(f=>{
      if(f.state==='uploading'){ active = true; f.progress = Math.min(100, f.progress + 18 + Math.floor(Math.random()*22)); if(f.progress>=100){ f.state = 'processing'; f.t = 0; } }
      else if(f.state==='processing'){ active = true; f.t = (f.t||0)+1; if(f.t>=3){ if(f.failOnce){ f.state = 'failed'; f.failOnce = false; f.error = 'Text could not be read — image resolution too low (simulated). Retry or upload a clearer copy.'; } else { f.state = 'processed'; f.days = f.daysPlanned||5; } } }
    }));
    if(!active){
      clearInterval(ocrTimer); b.ocr = 'idle'; recheckOCR();
      const failed = pls.flatMap(p=>b.files[p.id]||[]).filter(f=>f.state==='failed').length;
      if(failed) toast(`OCR finished — ${plural(failed,'file')} failed. Retry or remove it.`,'danger'); else toast('OCR complete — daily rows extracted. Review the flagged days next.','success');
      if(!failed) b.ocr = 'done';
    }
    if(ROUTE.path==='batch') render();
  }, 260);
};

ACT.sendEmail = () => {
  const m = S.ui.modal, f = m.f, i = iv(m.id);
  const rc = recipientCheck(i, f);
  if(!rc.to.length || rc.invalid.length || !f.subject.trim()){ f.tried = true; render(); toast('Check the recipients before sending.','danger'); return; }
  f.phase = 'sending'; islandTask('mail-'+i.id, { label:`Sending ${invNo(i)}`, detail:cl(i.client).name, status:'running', progress:undefined, action:null }); render();
  setTimeout(()=>{
    if(S.ui.modal!==m) return;
    const to = rc.to.join(', '), label = f.type==='reminder' ? 'Payment reminder (manual)' : i.status==='sent' ? 'Invoice (resent)' : 'Invoice';
    if(S.settings.simulateFailure && !f.failedOnce){ f.failedOnce = true; f.phase = 'failed'; i.emails.push({ date:TODAY, type:label, to, status:'Failed' }); log(i, `${label} to ${to} failed (simulated)`); islandTask('mail-'+i.id, { label:'Delivery failed', detail:invNo(i), status:'error', action:{ label:'Retry', fn:()=>{ if(S.ui.modal===m) ACT.sendEmail(); else ACT.openEmail(i.id, f.type); } } }); render(); toast('Delivery failed — the invoice was not marked as sent.','danger'); return; }
    i.emails.push({ date:TODAY, type:label, to, status:'Sent', from:ENTITIES[f.from].from });
    if(f.type==='invoice' && i.status==='verified'){ i.status = 'sent'; i.dates.sent = TODAY; i.approval = { status:'Awaiting Approval', submittedDate:TODAY, clientContact:'', responseDate:'', notes:'', rejectionReason:'' }; }
    log(i, `${label} sent to ${to} from ${ENTITIES[f.from].from}${rc.cc.length?' (CC '+rc.cc.join(', ')+')':''}`);
    notify(`${invNo(i)}: ${label.toLowerCase()} sent to ${cl(i.client).name}.`, 'info', '#/invoices?inv='+i.id);
    f.phase = 'sent'; f.sentTo = to; islandTask('mail-'+i.id, { label: f.type==='reminder'?'Reminder sent':'Invoice sent', detail:invNo(i), status:'done', action:{ label:'View', fn:()=>ACT.openInv(i.id) } }); render(); toast(`${label} sent (simulated)`);
  }, 1100);
};

ACT.savePayment = () => {
  const m = S.ui.modal, f = m.f, i = iv(m.id), bal = balance(i), amt = r2(+f.amount);
  f.tried = true;
  const partial = amt>0 && bal-amt>0.004;
  const bad = !(amt>0) || amt>bal+0.004 || !f.date || f.date>TODAY || (partial && (!f.reason || (f.reason==='Other' && !(f.reasonText||'').trim())));
  if(bad){ render(); toast('Check the highlighted fields.','danger'); return; }
  const reason = partial ? (f.reason==='Other' ? f.reasonText.trim() : f.reason + ((f.reasonText||'').trim()?' — '+f.reasonText.trim():'')) : '';
  i.payments.push({ id:uid('PM'), amount:amt, date:f.date, method:f.method, ref:f.ref, note:f.note, reason, recorded:TODAY, by:'Ganesh' });

  if(t.status==='running' && typeof t.progress==='number') return `<span class="k-isl-pct">${Math.round(t.progress*100)}%</span>`;
  return '';
}
function renderIsland(){
  const el = document.getElementById('island'); if(!el) return;
  if(!TASKS.length){ el.innerHTML = ''; ISL_OPEN = false; renderIsland.sig = ''; return; }
  const sig = ISL_OPEN + '|' + TASKS.map(t=>[t.id,t.status,t.label,t.detail,t.progress==null?'':Math.round(t.progress*100),t.action&&t.action.label].join(':')).join('/');
  if(sig===renderIsland.sig && el.firstChild) return;
  const isNew = !el.firstChild; renderIsland.sig = sig;
  const cur = TASKS[TASKS.length-1], n = TASKS.length, behind = ISL_OPEN ? 0 : Math.min(n-1,2);

function agentHTML(a){
  const now = Date.now(), run = a.steps.find(s=>s.status==='running'), err = a.steps.find(s=>s.status==='error'), done = a.steps.every(s=>s.status==='done');
  const title = err ? `Stopped at: ${err.label}` : done ? `Worked for ${fmtDur((a.end||now)-a.start)}` : run ? run.label : 'Getting ready';
  const wave = t => `<span class="k-wave" aria-hidden="true">${[...t].map((ch,k)=>`<span style="${phase(1600,k*.05)}">${ch===' '?'&nbsp;':esc(ch)}</span>`).join('')}</span><span class="sr-only">${esc(t)}</span>`;
  return `<div class="k-agent">
    <button type="button" class="k-agent-h" data-act="agentToggle" aria-expanded="${a.open}" aria-controls="agent-steps"><output>${esc(title)}</output>${!done&&!err?`<span class="t">${fmtDur(now-a.start)}</span>`:''}${done?`<span class="t">· ${plural(a.steps.length,'step')}</span>`:''}<span class="chev">${ic('chevD',16,2)}</span></button>
    ${a.open?`<ol class="k-steps" id="agent-steps">${a.steps.map((s,k)=>{ const last = k===a.steps.length-1, t = s.t0 ? (s.t1||now)-s.t0 : 0;
      return `<li class="k-step ${s.status}">${last?'':'<span class="rail" aria-hidden="true"><i></i></span>'}
        <span class="k-node">${s.status==='pending'?'<span class="dot"></span>':s.status==='running'?svgSpin():s.status==='done'?`<span style="color:var(--z700);display:flex">${svgDone('', !!once('ag-done-'+a.start+s.id,'1'))}</span>`:`<span style="color:var(--danger-solid);display:flex">${svgCross()}</span>`}</span>
        <div class="grow" style="margin-top:-2px"><div class="row" style="align-items:baseline;gap:8px"><p class="k-slabel" style="margin:0">${s.status==='running'?wave(s.label):esc(s.label)}</p>${s.t0?`<span class="k-stime">${fmtStep(t)}</span>`:''}</div>
          ${s.status==='running'&&s.log.length?`<div class="k-log" aria-hidden="true">${s.log.slice(-3).map((l,j,arr)=>`<div class="${once('ag-log-'+a.start+s.id+'-'+(s.log.length-arr.length+j))}"><i>${s.log.length-arr.length+j+1}</i><span>${esc(l)}</span></div>`).join('')}</div>`:''}
          ${(s.status==='done'||s.status==='error')&&a.showLogs!==false&&s.log.length&&s.status==='error'?`<div class="k-log" style="-webkit-mask-image:none">${(s.log.filter(l=>/unreadable|failed/.test(l)).length?s.log.filter(l=>/unreadable|failed/.test(l)):s.log.slice(-2)).map((l,j)=>`<div style="color:var(--danger)"><i>${j+1}</i><span>${esc(l)}</span></div>`).join('')}</div>`:''}
        </div></li>`; }).join('')}</ol>`:''}
  </div>`;
}
ACT.agentToggle = () => { const a = S.ui.batch.agent; if(a){ a.open = !a.open; render(); } };
function agentStep(id, patch){ const a = S.ui.batch.agent; if(!a) return; const s = a.steps.find(x=>x.id===id); if(patch.status==='running' && !s.t0) s.t0 = Date.now(); if((patch.status==='done'||patch.status==='error') && !s.t1) s.t1 = Date.now(); if(patch.log){ s.log.push(patch.log); delete patch.log; } Object.assign(s, patch); }

/* OCR run with agent steps + island (replaces the earlier runOCR) */
ACT.runOCR = () => {
  const b = S.ui.batch, pls = selPls(), per = pe(b.period); b.ocr = 'running';
  const files = pls.flatMap(p=>(b.files[p.id]||[]).filter(f=>f.state==='queued'));
  files.forEach(f=>{ f.state = 'uploading'; f.progress = 0; });
  const total = files.length;
  b.agent = { start:Date.now(), end:null, open:true, steps:[
    { id:'up', label:'Uploading files', status:'pending', log:[] }, { id:'ocr', label:'Reading text (OCR)', status:'pending', log:[] },
    { id:'match', label:'Matching dates to the billing period', status:'pending', log:[] }, { id:'flag', label:'Flagging anomalies', status:'pending', log:[] } ] };
  agentStep('up', { status:'running' });
  islandTask('ocr', { label:'Reading timesheets', detail:plural(total,'file'), status:'running', progress:0, action:null });
  render(); clearInterval(ocrTimer);
  ocrTimer = setInterval(()=>{
    let active = false, finished = 0;
    files.forEach(f=>{
      if(!pls.some(p=>(b.files[p.id]||[]).includes(f))){ finished++; return; } /* removed / cancelled */
      if(f.state==='uploading'){ active = true; f.progress = Math.min(100, f.progress + 18 + Math.floor(Math.random()*22)); if(f.progress>=100){ f.state = 'processing'; f.t = 0; agentStep('up', { log:'Uploaded '+f.name }); } }
      else if(f.state==='processing'){ active = true; f.t = (f.t||0)+1; if(f.t>=3){ if(f.failOnce){ f.state = 'failed'; f.failOnce = false; f.error = 'Unreadable — image resolution too low. Retry or upload a clearer copy.'; agentStep('ocr', { log:`${f.name} — unreadable (low resolution)` }); } else { f.state = 'processed'; f.days = f.daysPlanned||5; agentStep('ocr', { log:`${f.name} — ${f.days} days found` }); } } }
      if(f.state==='processed'||f.state==='failed') finished++;
    });
    if(!files.some(f=>f.state==='uploading')){ agentStep('up', { status:'done' }); agentStep('ocr', { status:'running' }); }
    islandTask('ocr', { progress: total ? finished/total : 1, detail:`${finished} of ${plural(total,'file')}` });
    if(!active){
      clearInterval(ocrTimer);
      const failed = pls.flatMap(p=>b.files[p.id]||[]).filter(f=>f.state==='failed');
      if(failed.length){
        agentStep('ocr', { status:'error' }); b.agent.end = Date.now(); b.ocr = 'idle';
        islandTask('ocr', { label:'OCR stopped', detail:`${plural(failed.length,'file')} unreadable`, status:'error', progress:undefined, action:{ label:'Retry', fn:()=>{ failed.forEach(f=>{ f.state='queued'; f.progress=0; f.error=''; }); go('#/batch'); S.ui.batch.step = 2; ACT.runOCR(); } } });
        toast(`OCR stopped — ${plural(failed.length,'file')} could not be read. Retry or remove it.`,'danger');
        render(); return;
      }
      agentStep('ocr', { status:'done' });
      recheckOCR(); b.ocr = 'running';
      agentStep('match', { status:'running', log:`${per.workdays} working days in ${per.label}` }); render();
      setTimeout(()=>{
        const rows = pls.flatMap(p=>b.rows[p.id]||[]);
        agentStep('match', { log:`${rows.filter(r=>r.flag!=='outside').length} daily rows mapped across ${plural(pls.length,'consultant')}` });
        agentStep('match', { log:`${rows.filter(r=>r.flag==='outside').length} date(s) outside the period excluded` });
        agentStep('match', { status:'done' }); agentStep('flag', { status:'running' }); render();
        setTimeout(()=>{
          const cnt = f => rows.filter(r=>r.flag===f).length;
          agentStep('flag', { log:`${cnt('missing')} missing day(s), ${cnt('high')} unusually high` });
          agentStep('flag', { log:`${cnt('duplicate')} duplicate date(s), ${cnt('weekend')} weekend entr${cnt('weekend')===1?'y':'ies'}` });
          agentStep('flag', { status:'done' }); b.agent.end = Date.now(); b.agent.open = false; b.ocr = 'done';
          const days = rows.filter(r=>r.include).length;
          islandTask('ocr', { label:'Timesheets read', detail:`${days} days extracted`, status:'done', progress:undefined, action:{ label:'Review', fn:()=>{ if(ROUTE.path!=='batch') go('#/batch'); ACT.batchStep(3); } } });
          toast('OCR complete — review the flagged days next.','success');
          render();
        }, 750);
      }, 750);
    }
    if(ROUTE.path==='batch') render();
  }, 260);
};

function fuzzy(text, q){
  if(!q) return { score:1, idx:[] };
  const t = text.toLowerCase(), s = q.toLowerCase(), at = t.indexOf(s);
  if(at>=0) return { score: 100 - at, idx: Array.from({length:s.length},(_,k)=>at+k) };
  const idx = []; let j = 0;
  for(let k=0;k<t.length && j<s.length;k++) if(t[k]===s[j]){ idx.push(k); j++; }
  return j===s.length ? { score: 50 - (idx[idx.length-1]-idx[0]), idx } : null;
}
function hl(text, idx){ if(!idx.length) return esc(text); let o=''; for(let k=0;k<text.length;k++) o += idx.includes(k) ? `<b>${esc(text[k])}</b>` : esc(text[k]); return o; }
function cmdList(){
  const st = S.ui.cmd, q = st.q.trim(), page = st.stack[st.stack.length-1];
  const base = page ? page.children().map(x=>Object.assign({ sec:page.label }, x)) : cmdItems();
  let rows = [];
  if(!page && !q){
    const rec = (S.ui.cmdRecent||[]).map(id=>base.find(x=>x.id===id)).filter(Boolean).map(x=>Object.assign({}, x, { sec:'Recent' }));
    rows = rec.concat(base);
  } else {
    const secOrder = [...new Set(base.map(x=>x.sec))];
    rows = base.map(x=>{ const m = fuzzy(x.label, q) || (x.kw && x.kw.toLowerCase().includes(q.toLowerCase()) ? { score:10, idx:[] } : null); return m ? Object.assign({}, x, { _m:m }) : null; }).filter(Boolean)
      .sort((p,r)=> (secOrder.indexOf(p.sec)-secOrder.indexOf(r.sec)) || (r._m.score-p._m.score));
    if(!page && q.length>=2){
      const invs = S.data.invoices.map(i=>{ const lab = `${invNo(i)} · ${cl(i.client).name} · ${consOf(pl(i.placement)).name}`; const m = fuzzy(lab, q); return m ? { sec:'Invoices', id:'inv-'+i.id, label:lab, hint:WF[i.status][0], icon:'receipt', run:()=>ACT.openInv(i.id), _m:m } : null; }).filter(Boolean).sort((a,b)=>b._m.score-a._m.score).slice(0,6);
      rows = invs.concat(rows);
    }
  }
  return rows;
}

ACT.cmdRun = k => {

function cmdKey(e){
  const st = S.ui.cmd, rows = st.open ? cmdList() : [];
  if(e.key==='ArrowDown' || e.key==='ArrowUp'){ e.preventDefault(); if(!st.open){ st.open = true; render(); return; } if(!rows.length) return; st.idx = (st.idx + (e.key==='ArrowDown'?1:-1) + rows.length) % rows.length; render(); const o = document.getElementById('kc-'+st.idx); if(o) o.scrollIntoView({ block:'nearest' }); return; }
  if(e.key==='Home' && st.open){ e.preventDefault(); st.idx = 0; render(); return; }
  if(e.key==='End' && st.open){ e.preventDefault(); st.idx = Math.max(0,rows.length-1); render(); return; }
  if(e.key==='Enter'){ e.preventDefault(); if(!st.open){ st.open = true; render(); return; } if(rows[st.idx]) ACT.cmdRun(st.idx); return; }
  if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); if(st.open){ cmdClose(); render(); } else { st.q = ''; render(); } return; }
  if(e.key==='Backspace' && !st.q && st.stack.length){ e.preventDefault(); ACT.cmdBack(); return; }
  if(e.key==='Tab'){ cmdClose(); render(); }
}

/* ===== Undo button (timed undo window drawn around the pill edge) ===== */
let UNDO = null; const UNDO_REG = {};
function undoBtn(o){
  UNDO_REG[o.key] = o;
  if(o.disabled) return `<span class="k-undo"><button type="button" disabled style="opacity:.5;cursor:not-allowed" title="${esc(o.title||'')}">${ic(o.icon||'send',14,2)}<span style="margin-left:8px">${esc(o.label)}</span></button></span>`;
  if(UNDO && UNDO.key===o.key){
    if(UNDO.phase==='done') return `<span class="k-undo"><button type="button" class="done" aria-disabled="true"><span class="ct ${once('undo-d-'+UNDO.key+UNDO.last0,'k-anim-up')}">${ic('check',14,2)}${esc(UNDO.doneLabel)}</span></button></span>`;
    const secs = Math.ceil(Math.max(0, UNDO.ms-UNDO.elapsed)/1000);
    return `<span class="k-undo"><button type="button" id="undo-btn" data-act="undoCancel" aria-label="${esc(UNDO.doneLabel)}. Undo, ${plural(secs,'second')} left"><span class="ct ${once('undo-p-'+UNDO.key+UNDO.last0,'k-anim-up')}"><span class="dl">${esc(UNDO.doneLabel)}</span><span class="dv"></span>${ic('undo',14,2)}<span>Undo</span><span class="n" id="undo-n">${secs}</span><kbd class="kbd hide-sm">${MAC?'⌘Z':'Ctrl Z'}</kbd></span></button><svg class="edge" aria-hidden="true"><title>Time left to undo</title><path id="undo-path"/></svg></span>`;
  }
  return `<span class="k-undo"><button type="button" data-act="undoStart" data-a="${esc(o.key)}"><span class="ct">${ic(o.icon||'send',14,2)}${esc(o.label)}</span></button></span>`;
}
function pillPath(w,h){ const s = .75, x0 = s, x1 = w-s, y0 = s, y1 = h-s, r = (y1-y0)/2; return `M ${w/2} ${y0} H ${x1-r} A ${r} ${r} 0 0 1 ${x1-r} ${y1} H ${x0+r} A ${r} ${r} 0 0 1 ${x0+r} ${y0} Z`; }
function undoFrame(){
  if(!UNDO || UNDO.phase!=='pending') return;

  const b = document.getElementById('undo-btn'), hovered = b && b.matches(':hover');
  if(!hovered && !document.hidden) UNDO.elapsed += dt;
  const left = Math.max(0, UNDO.ms-UNDO.elapsed), path = document.getElementById('undo-path');
  if(b && path){ path.setAttribute('d', pillPath(b.offsetWidth, b.offsetHeight)); const L = path.getTotalLength(); path.style.strokeDasharray = `${L*left/UNDO.ms} ${L}`; const n = document.getElementById('undo-n'); if(n) n.textContent = Math.ceil(left/1000); }

    UNDO.phase = 'done'; const u = UNDO; u.run(); render();
    setTimeout(()=>{ if(UNDO===u){ UNDO = null; render(); } }, 2400);
    return;
  }
  requestAnimationFrame(undoFrame);
}
ACT.undoStart = key => {

  const o = UNDO_REG[key]; if(!o) return;
  UNDO = Object.assign({}, o, { ms:o.ms||5000, elapsed:0, last:performance.now(), phase:'pending' }); UNDO.last0 = UNDO.last;
  document.getElementById('live').textContent = `${o.doneLabel}. Press the button or ${MAC?'Command':'Control'} Z to undo.`;

/* ===== Swipe-Tabs-style sliding indicator for segmented controls ===== */
const SEG_POS = {};
function positionSeg(){

/* ===== Hooks run after every render ===== */
function enhanceTables(){
  document.querySelectorAll('#view .tbl-wrap, #overlay .tbl-wrap, #modal .tbl-wrap').forEach(w => {
    const t = w.querySelector('table'); if(!t) return;
    const wide = t.scrollWidth > w.clientWidth + 1;
    if(t.hasAttribute('data-pr')){
      w.classList.toggle('is-wide', wide);
      if(wide){
        const card = w.closest('.card'), title = card && card.querySelector('.card-title, h2, h3');
        w.setAttribute('tabindex','0'); w.setAttribute('role','region');
        w.setAttribute('aria-label', (title ? title.textContent.trim()+' table' : 'Table') + ', scrolls horizontally');
      }
      return;
    }
    w.classList.toggle('is-wide', wide);
    t.querySelectorAll('.stick,.stick-start,.stick-start-last,.stick-end').forEach(c=>{ c.classList.remove('stick','stick-start','stick-start-last','stick-end'); c.style.left=''; });
    if(!wide){ w.removeAttribute('tabindex'); w.removeAttribute('role'); w.removeAttribute('aria-label'); w.onscroll = null; return; }
    const card = w.closest('.card'), title = card && card.querySelector('.card-title, h2, h3');
    w.setAttribute('tabindex','0'); w.setAttribute('role','region'); w.setAttribute('aria-label', (title ? title.textContent.trim()+' table' : 'Table') + ', scrolls horizontally');
    const heads = [...t.querySelectorAll('thead th')]; if(!heads.length) return;
    /* Leading: the identifying column (plus the selection checkbox column before it, if any) */
    const lead = heads[0].querySelector('input') || !heads[0].textContent.trim() ? [0,1] : [0];
    let left = 0;
    lead.forEach((ci,k) => { const w0 = heads[ci] ? heads[ci].getBoundingClientRect().width : 0;
      t.querySelectorAll(`tr > :nth-child(${ci+1})`).forEach(c => { c.classList.add('stick','stick-start'); if(k===lead.length-1) c.classList.add('stick-start-last'); c.style.left = left+'px'; });
      left += w0; });
    /* Trailing: the action column, so the row's next step is never past the scroll edge */
    const last = heads[heads.length-1], lt = last.textContent.trim();
    if(!lt || /action/i.test(lt)) t.querySelectorAll('tr > :last-child').forEach(c => c.classList.add('stick','stick-end'));
    /* Pinned columns may take at most 55% of the visible width; drop the leading pin first, then the trailing one */
    const pinned = () => [...t.querySelectorAll('thead th.stick')].reduce((a,c)=>a+c.getBoundingClientRect().width,0);
    if(pinned() > w.clientWidth*0.55) t.querySelectorAll('.stick-start').forEach(c=>{ c.classList.remove('stick','stick-start','stick-start-last'); c.style.left=''; });
    if(pinned() > w.clientWidth*0.55) t.querySelectorAll('.stick-end').forEach(c=>c.classList.remove('stick','stick-end'));
    const edges = () => { w.classList.toggle('sc-l', w.scrollLeft > 1); w.classList.toggle('sc-r', w.scrollLeft + w.clientWidth < w.scrollWidth - 1); };
    w.onscroll = edges; edges();
  });
}

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"></script>
<script>
'use strict';
/* =====================================================================
   Motion layer — GSAP 3 + ScrollTrigger + Lenis smooth scrolling.
   Thesis (Operate surface): motion explains state and continuity, never
   blocks work. One authored moment: the workflow strip's stage-health bars
   draw in left to right when a view opens, so the pipeline's trouble spots
   read before anything else. Supporting motion: short route entry, KPI
   count-up on the overview, sheet/dialog/menu enter + exit, Sonner toasts,
   topbar elevation and data-bar fills tied to scroll.
   Everything rests visible: if a script fails, nothing stays hidden.
   Reduced motion: no Lenis, no movement; opacity cross-fades only.
   ===================================================================== */
document.documentElement.lang = 'en';
(function(){
  const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const G = typeof window.gsap !== 'undefined' ? window.gsap : null;
  const ST = G && typeof window.ScrollTrigger !== 'undefined' ? window.ScrollTrigger : null;
  if(ST) G.registerPlugin(ST);
  if(G) G.defaults({ overwrite:'auto' });
  const EASE = 'expo.out';

  /* ---------- Lenis smooth scrolling ---------- */
  let lenis = null;
  if(!RM && typeof window.Lenis !== 'undefined'){
    try{
      lenis = new Lenis({
        duration:1.0, smoothWheel:true, wheelMultiplier:1, touchMultiplier:1.2,
        easing:t => Math.min(1, 1.001 - Math.pow(2, -10*t)),
        /* overlays, menus and the sidebar keep native scroll */
        prevent:node => !!(node && node.closest && node.closest('.drawer,.modal,.menu,.pop,.k-cmd-panel,.k-acct,.nav,.tb-canvas-wrap,.is-preview-scroll,.k-isl,[data-lenis-prevent]'))
      });

      else { const raf = t => { lenis.raf(t); requestAnimationFrame(raf); }; requestAnimationFrame(raf); }
    }catch(e){ lenis = null; }
  }
  window.APT_LENIS = lenis;
  const toTop = () => { if(lenis) lenis.scrollTo(0, { immediate:true, force:true }); else window.scrollTo(0,0); };
  /* ---------- Topbar elevation tied to scroll ---------- */
  const topbar = document.getElementById('topbar');
  const elevate = () => topbar && topbar.classList.toggle('is-scrolled', window.scrollY > 6);
  window.addEventListener('scroll', elevate, { passive:true }); elevate();

  /* ---------- Helpers ---------- */
  const $ = (s, r=document) => r.querySelector(s), $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
  let routeTweens = [], routeTriggers = [];
  function clearRoute(){ routeTweens.forEach(t => t.kill()); routeTriggers.forEach(t => t.kill()); routeTweens = []; routeTriggers = []; }
  function fadeIn(targets, vars){ if(!G || !targets || (Array.isArray(targets) && !targets.length)) return;
    if(RM){ routeTweens.push(G.fromTo(targets, { autoAlpha:0 }, { autoAlpha:1, duration:.2, ease:'none', clearProps:'opacity,visibility' })); return; }
    routeTweens.push(G.fromTo(targets, Object.assign({ autoAlpha:0, y:12, filter:'blur(4px)' }, vars && vars.from), Object.assign({ autoAlpha:1, y:0, filter:'blur(0px)', duration:.32, ease:'power2.out', clearProps:'opacity,visibility,transform,filter' }, vars && vars.to)));
  }

  /* Workflow stepper: health is authored in markup; animate dots on view entry */
  function decorateFlow(){
    $$('#view .flow-step').forEach(s => {
      if(!s.dataset.health){
        const c = s.querySelector('.flow-c');
        s.dataset.health = c && c.classList.contains('bad') ? 'bad' : c && c.classList.contains('attn') ? 'attn' : 'ok';
      }
    });
  }
  function drawFlow(){
    const dots = $$('#view .flow-step .flow-dot'); if(!G || !dots.length) return;
    if(RM){ routeTweens.push(G.fromTo(dots, { autoAlpha:0 }, { autoAlpha:1, duration:.2, clearProps:'opacity,visibility' })); return; }
    routeTweens.push(G.fromTo(dots, { autoAlpha:0, scale:.86 }, { autoAlpha:1, scale:1, duration:.38, ease:EASE, stagger:.05, delay:.08, clearProps:'opacity,visibility,transform' }));
  }

  /* KPI count-up (overview + vendor + reports tiles): text → number → tween → formatted text */
  function countUp(){
    if(!G || RM) return;
    $$('#view .kpi-val').forEach((el, k) => {
      const raw = el.textContent.trim(); const m = raw.match(/^(\$?)([\d,]+(?:\.\d+)?)$/); if(!m) return;
      const end = parseFloat(m[2].replace(/,/g,'')), dec = (m[2].split('.')[1]||'').length; if(!isFinite(end) || end === 0) return;
      const o = { v:0 };
      routeTweens.push(G.to(o, { v:end, duration:.9, ease:'power3.out', delay:.08 + k*.05,
        onUpdate(){ if(el.isConnected) el.textContent = m[1] + o.v.toLocaleString('en-US', { minimumFractionDigits:dec, maximumFractionDigits:dec }); },
        onComplete(){ if(el.isConnected) el.textContent = raw; } }));
    });
  }

  /* Data bars (aging bar, progress) fill when scrolled into view */
  function fillBars(){
    if(!G || !ST) return;
    $$('#view .bar').forEach(bar => {
      const segs = $$('span', bar); if(!segs.length) return;
      if(RM) return;
      G.set(segs, { scaleX:0, transformOrigin:'left center' });
      routeTriggers.push(ST.create({ trigger:bar, start:'top bottom-=40', once:true,
        onEnter(){ routeTweens.push(G.to(segs, { scaleX:1, duration:.8, ease:EASE, stagger:.08, clearProps:'transform' })); } }));
    });
  }

  /* Sections below the fold rise in as they enter (dashboards only, not every list) */
  function revealBelowFold(){
    if(!G || !ST || RM) return;
    if(!['overview','reports','vendor'].includes(ROUTE.path)) return;
    const vh = window.innerHeight;
    const els = $$('#view .page > *').filter(el => el.getBoundingClientRect().top > vh - 24);
    if(!els.length) return;
    G.set(els, { autoAlpha:0, y:18 });

    routeTriggers.push(...ST.batch(els, { start:'top bottom-=10', once:true, onEnter:show }));

    routeTweens.push(G.delayedCall(6, () => { const hidden = els.filter(e => e.isConnected && +getComputedStyle(e).opacity < 1); if(hidden.length) show(hidden); }));
  }

    clearRoute();

    const head = page.querySelector(':scope > .page-head'), flow = page.querySelector(':scope > .flow');
    const first = Array.from(page.children).filter(el => el !== head && el !== flow && el.getBoundingClientRect().top < window.innerHeight);
    fadeIn([head, flow].filter(Boolean), { to:{ stagger:.06 } });
    fadeIn(first.slice(0,3), { to:{ delay:.08, stagger:.06 } });
    drawFlow(); countUp(); fillBars(); revealBelowFold();
    if(ST) requestAnimationFrame(() => ST.refresh());
  }

  /* ---------- Overlay enter animations (sheet, dialog, alert dialog, menus) ---------- */
  let lastDrawer = '', lastModal = '', lastConfirm = '', lastMenu = '', lastPop = false, lastAcct = false, lastCmd = false;
  function overlays(){
    const d = S.ui.drawer, m = S.ui.modal, cf = S.ui.confirm;
    const dk = d ? d.type + ':' + (d.id||'') : '', mk = m ? m.type + ':' + (m.id||'') : '', ck = cf ? cf.title : '';
    if(G){
      if(dk && dk !== lastDrawer && !lastDrawer){
        const el = $('.drawer'), wr = $('.drawer-wrap');
        if(RM){ G.fromTo([el, wr], { autoAlpha:0 }, { autoAlpha:1, duration:.18, clearProps:'opacity,visibility' }); }
        else { G.fromTo(el, { xPercent:100 }, { xPercent:0, duration:.42, ease:EASE, clearProps:'transform' }); G.fromTo(wr, { autoAlpha:0 }, { autoAlpha:1, duration:.25, clearProps:'opacity,visibility' }); }
      }
      if(mk && mk !== lastModal){
        const el = $('#modal .modal'), bd = $('#modal .backdrop');
        if(RM) G.fromTo(el, { autoAlpha:0 }, { autoAlpha:1, duration:.18, clearProps:'opacity,visibility' });
        else G.fromTo(el, { autoAlpha:0, scale:.96, y:8 }, { autoAlpha:1, scale:1, y:0, duration:.3, ease:EASE, clearProps:'opacity,visibility,transform' });
        if(!lastModal && bd && !RM) G.fromTo(bd, { autoAlpha:0 }, { autoAlpha:1, duration:.2, ease:'none', clearProps:'opacity,visibility' });
      }
      if(ck && ck !== lastConfirm){
        const el = $('#confirm .modal');
        if(RM) G.fromTo(el, { autoAlpha:0 }, { autoAlpha:1, duration:.15, clearProps:'opacity,visibility' });
        else G.fromTo(el, { autoAlpha:0, scale:.95 }, { autoAlpha:1, scale:1, duration:.24, ease:EASE, clearProps:'opacity,visibility,transform' });
      }
      const pop = (sel, origin) => { const el = $(sel); if(!el) return; if(RM) G.fromTo(el, { autoAlpha:0 }, { autoAlpha:1, duration:.12, clearProps:'opacity,visibility' }); else G.fromTo(el, { autoAlpha:0, scale:.97, y:-4, transformOrigin:origin }, { autoAlpha:1, scale:1, y:0, duration:.18, ease:'power2.out', clearProps:'opacity,visibility,transform' }); };
      if(S.ui.menu && S.ui.menu !== lastMenu) pop('.menu', 'top right');
      if(S.ui.notif && !lastPop) pop('.pop', 'top right');
      if(S.ui.acct && !lastAcct) pop('.k-acct', 'top right');
      if(S.ui.cmd && S.ui.cmd.open && !lastCmd){ const l = $('.k-cmd-list'); if(l && !RM) G.fromTo([l, $('.k-cmd-foot')].filter(Boolean), { autoAlpha:0, y:-6 }, { autoAlpha:1, y:0, duration:.2, ease:'power2.out', clearProps:'opacity,visibility,transform' }); }
    }
    lastDrawer = dk; lastModal = mk; lastConfirm = ck; lastMenu = S.ui.menu || ''; lastPop = !!S.ui.notif; lastAcct = !!S.ui.acct; lastCmd = !!(S.ui.cmd && S.ui.cmd.open);
    const om = $('.menu'); if(om){ const cell = om.closest('td,th'); if(cell){ cell.style.zIndex = '40'; if(getComputedStyle(cell).position === 'static') cell.style.position = 'relative'; } }
    if(lenis){ (d || m || cf) ? lenis.stop() : lenis.start(); }
    $$('.drawer-body,.modal-body,.k-cmd-list,.menu').forEach(el => el.setAttribute('data-lenis-prevent',''));
  }

  /* ---------- Exit animations: shorter and smaller than enters ---------- */
  let closing = false;
  function wrapExit(name, pick){
    const orig = ACT[name]; if(typeof orig !== 'function') return;
    ACT[name] = function(...args){
      const plan = G && !closing ? pick() : null;
      if(!plan) return orig.apply(this, args);
      closing = true;
      const done = () => { closing = false; orig.apply(this, args); };
      if(RM){ G.to(plan.els, { autoAlpha:0, duration:.12, onComplete:done }); return; }
      const tl = G.timeline({ onComplete:done });
      plan.steps.forEach(([t, v]) => tl.to(t, v, 0));
    };
  }
  wrapExit('closeDrawer', () => { const el = $('.drawer'), wr = $('.drawer-wrap'); if(!el || S.ui.modal || S.ui.confirm) return null;
    return { els:[el, wr], steps:[[el, { xPercent:100, duration:.24, ease:'power2.in' }], [wr, { autoAlpha:0, duration:.2, ease:'none' }]] }; });
  wrapExit('closeModal', () => { const m = S.ui.modal; if(!m || m.prev) return null; const el = $('#modal .modal'), bd = $('#modal .backdrop'); if(!el) return null;
    return { els:[el, bd], steps:[[el, { autoAlpha:0, scale:.97, y:-8, filter:'blur(4px)', duration:.15, ease:'power1.out' }], [bd, { autoAlpha:0, duration:.17, ease:'none' }]] }; });
  wrapExit('confirmNo', () => { const el = $('#confirm .modal'), bd = $('#confirm .backdrop'); if(!el) return null;
    return { els:[el, bd], steps:[[el, { autoAlpha:0, scale:.97, duration:.13, ease:'power1.out' }], [bd, { autoAlpha:0, duration:.15, ease:'none' }]] }; });

  /* ---------- Sonner-style toasts (replaces the inline toast) ---------- */
  toast = function(msg, tone='success', action){
    const box = document.getElementById('toasts'); if(!box) return;
    const el = document.createElement('div');
    el.className = 'toast ' + tone;
    el.innerHTML = `<span class="t-ic">${ic(tone==='danger'?'xCircle':tone==='warning'?'alert':tone==='info'?'info':'checkCircle',18,2)}</span><div class="col grow" style="min-width:0"><span>${esc(msg)}</span>${action?`<button type="button" class="t-act">${esc(action.label)} →</button>`:''}</div><button type="button" class="t-x" aria-label="Dismiss notification">${ic('x',14,2)}</button>`;
    const out = () => { if(!el.isConnected || el._out) return; el._out = true; clearTimeout(el._tm);
      if(G && !RM) G.to(el, { autoAlpha:0, y:8, scale:.97, filter:'blur(4px)', duration:.16, ease:'power1.out', onComplete:() => el.remove() });
      else if(G) G.to(el, { autoAlpha:0, duration:.12, onComplete:() => el.remove() }); else el.remove(); };
    el.querySelector('.t-x').onclick = out;
    if(action) el.querySelector('.t-act').onclick = () => { out(); action.fn(); };
    el.addEventListener('mouseenter', () => clearTimeout(el._tm));
    el.addEventListener('mouseleave', () => { el._tm = setTimeout(out, 2600); });
    box.appendChild(el);
    while(box.querySelectorAll('.toast:not([data-out])').length > 3){ const f = box.querySelector('.toast'); f.dataset.out = '1'; f.remove(); }
    if(G) G.fromTo(el, RM ? { autoAlpha:0 } : { autoAlpha:0, y:16, scale:.97 }, { autoAlpha:1, y:0, scale:1, duration: RM ? .15 : .38, ease:EASE, clearProps:'opacity,visibility,transform' });
    el._tm = setTimeout(out, action ? 8000 : 5000);
  };

  /* ---------- Artifact-safe replacements for browser features the viewer blocks ---------- */
  const origExport = ACT.exportCSV;
  ACT.exportCSV = function(mode){
    /* the viewer blocks script downloads, so the CSV also goes to the clipboard */
    const list = mode==='sel' ? Object.keys(S.ui.inv.sel).filter(k=>S.ui.inv.sel[k]).map(iv).filter(Boolean)
      : mode==='rep' ? S.data.invoices.filter(i=>(!S.ui.rep.entity||i.entity===S.ui.rep.entity)&&(!S.ui.rep.month||i.invDate.slice(0,7)===S.ui.rep.month)&&(!S.ui.rep.status||i.status===S.ui.rep.status)) : filteredInvoices();
    const rows = [['Invoice','Client','Consultant','Entity','Billing period','Invoice date','Due date','Hours','Rate','Total','Received','Balance','Invoice status','Payment status','Days overdue']]
      .concat(list.map(i=>[invNo(i), cl(i.client).name, consOf(pl(i.placement)).name, ENTITIES[i.entity].short, pe(i.period).label, i.invDate, i.due, i.hours, i.rate, invTotal(i), paidAmt(i), i.status==='sent'?balance(i):'', WF[i.status][0], payStatus(i)||'Not sent', overdueDays(i)||'']));
    const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const ok = () => { islandTask('csv', { label:'CSV copied', detail:plural(list.length,'row'), status:'done', action:null }); toast(`${plural(list.length,'invoice')} copied as CSV — paste into Excel or Sheets`); };
    try{ navigator.clipboard.writeText(csv).then(ok, () => origExport(mode)); }catch(e){ origExport(mode); }
  };

  /* ---------- Hook into the app's render cycle ---------- */
  let lastHash = null;
  const origAfter = kokonutAfter;
  kokonutAfter = function(){
    origAfter();
    decorateFlow();
    overlays();
    if(HASH !== lastHash){ const first = lastHash === null; lastHash = HASH; if(!first) toTop(); enterView(); }
    else if(ST){ routeTriggers = routeTriggers.filter(t => { if(t.trigger && !t.trigger.isConnected){ t.kill(); return false; } return true; }); }
  };
  /* Template rename: the viewer has no prompt() dialog, so rename in the editor's name field */
  const origTb = ACT.tbAction;
  ACT.tbAction = function(action){
    const [cmd, arg] = String(action||'').split(':');
    if(cmd === 'rename'){ TB.selected = arg; TB.tab = 'designer'; render(); const f = document.getElementById('tb-cfg-name'); if(f){ f.focus(); f.select(); } toast('Rename the template in “Template name”, then save.','info'); return; }
    return origTb(action);
  };

  render();
  if(ST) window.addEventListener('load', () => ST.refresh());
})();
</script>
</body>
